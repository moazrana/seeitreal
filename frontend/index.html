<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SeeItReal — Dashboard</title>
    <!-- Classic (blocking) script on purpose: applies the stored light/dark
         choice before first paint so the page never flashes the wrong theme
         (documents/USER-APP-theming.md §3). Served by the Vite plugin in
         vite.config.ts from @ar-menu/shared. -->
    <script src="/theme-init.js"></script>
    <!-- Space Grotesk (display) + Inter (body) for the marketing landing
         page (documents/seeitreal-design-spec.md §2, §6). Both declare a
         system-font fallback stack in landing.module.css so the layout
         survives if this fails to load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=Inter:wght@400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
