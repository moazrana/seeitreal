<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="seeitreal logo">
  <defs>
    <linearGradient id="gemGrad" x1="78" y1="18" x2="24" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="68%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="bracketGrad" x1="4" y1="4" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Faceted gem: two interior points (A above center, B below) fan out to
       the hexagon's six vertices, tiling it into 8 crystal-like facets. One
       gradient sampled in absolute space gives the whole gem a single
       consistent light source (teal upper-right -> deep purple lower-left)
       instead of per-facet guesswork. -->
  <g stroke="#F0FBFF" stroke-opacity="0.45" stroke-width="0.6" stroke-linejoin="round">
    <polygon points="28.35,37.5 50,25 50,38" fill="url(#gemGrad)"/>
    <polygon points="50,25 71.65,37.5 50,38" fill="url(#gemGrad)"/>
    <polygon points="71.65,37.5 71.65,62.5 50,58" fill="url(#gemGrad)"/>
    <polygon points="71.65,62.5 50,75 50,58" fill="url(#gemGrad)"/>
    <polygon points="50,75 28.35,62.5 50,58" fill="url(#gemGrad)"/>
    <polygon points="50,38 28.35,62.5 28.35,37.5" fill="url(#gemGrad)"/>
    <polygon points="50,38 50,58 28.35,62.5" fill="url(#gemGrad)"/>
    <polygon points="50,38 71.65,37.5 50,58" fill="url(#gemGrad)"/>
  </g>

  <!-- Viewfinder corner brackets, camera/AR-scan style -->
  <g fill="none" stroke="url(#bracketGrad)" stroke-width="4" stroke-linecap="round">
    <path d="M8,22 V12 A4,4 0 0 1 12,8 H22"/>
    <path d="M78,8 H88 A4,4 0 0 1 92,12 V22"/>
    <path d="M22,92 H12 A4,4 0 0 1 8,88 V78"/>
    <path d="M92,78 V88 A4,4 0 0 1 88,92 H78"/>
  </g>

  <!-- Small dot clusters echoing a camera-scan targeting reticle -->
  <g fill="url(#bracketGrad)" opacity="0.85">
    <circle cx="16" cy="16" r="1.3"/>
    <circle cx="20" cy="16" r="1.3"/>
    <circle cx="16" cy="20" r="1.3"/>

    <circle cx="84" cy="16" r="1.3"/>
    <circle cx="80" cy="16" r="1.3"/>
    <circle cx="84" cy="20" r="1.3"/>

    <circle cx="16" cy="84" r="1.3"/>
    <circle cx="20" cy="84" r="1.3"/>
    <circle cx="16" cy="80" r="1.3"/>

    <circle cx="84" cy="84" r="1.3"/>
    <circle cx="80" cy="84" r="1.3"/>
    <circle cx="84" cy="80" r="1.3"/>
  </g>
</svg>
