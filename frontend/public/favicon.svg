      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="68%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#5B21B6"/>
