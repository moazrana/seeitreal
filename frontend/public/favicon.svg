    <polygon points="50,75 28.35,62.5 50,58" fill="url(#gemGrad)"/>
    <polygon points="50,38 28.35,62.5 28.35,37.5" fill="url(#gemGrad)"/>
    <polygon points="50,38 50,58 28.35,62.5" fill="url(#gemGrad)"/>
    <polygon points="50,38 71.65,37.5 50,58" fill="url(#gemGrad)"/>
  </g>

  <g fill="none" stroke="url(#bracketGrad)" stroke-width="6" stroke-linecap="round">
